[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northline-retail"
version = "1.0.0"
description = "Northline Outfitters sales, orders, and inventory lakehouse (Azure-ready, locally executable)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Northline Data Engineering" }]

[project.scripts]
northline = "northline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["northline"]
omit = ["*/cli.py", "*/jobs/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
