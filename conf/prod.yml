environment: prod
storage:
  mode: ${NL_STORAGE_MODE:-adls}
  storage_account: ${NL_STORAGE_ACCOUNT:-stnlretailprod}
  local_root: ${NL_LOCAL_ROOT:-data/lake}
  landing: ${NL_LANDING:-data/sample}
catalog:
  mode: ${NL_CATALOG_MODE:-unity}
  name: ${NL_CATALOG:-northline_prod}
  bronze_schema: bronze
  silver_schema: silver
  gold_schema: gold
  audit_schema: audit
spark:
  app_name: northline-retail
  master: local[*]
  shuffle_partitions: 200
  driver_memory: 4g
  broadcast_threshold_bytes: 52428800
pipeline:
  name: northline_medallion
  amount_tolerance: "0.05"
  dq_fail_rate_alert_threshold: 0.02
  retry_attempts: 5
  retry_backoff_seconds: 2
  scd2_epoch: "2020-01-01T00:00:00Z"
  inventory_window_days: 28
alerts:
  webhook_url: ${NL_ALERT_WEBHOOK_URL:-}
secrets:
  mode: databricks
  scope: nl-kv-prod
logging:
  dir: ${NL_LOG_DIR:-/dbfs/tmp/northline/logs}
