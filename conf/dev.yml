environment: dev
storage:
  mode: ${NL_STORAGE_MODE:-local}
  storage_account: ${NL_STORAGE_ACCOUNT:-stnlretaildev}
  local_root: ${NL_LOCAL_ROOT:-data/lake}
  landing: ${NL_LANDING:-data/sample}
catalog:
  mode: ${NL_CATALOG_MODE:-local}
  name: ${NL_CATALOG:-northline_dev}
  bronze_schema: bronze
  silver_schema: silver
  gold_schema: gold
  audit_schema: audit
spark:
  app_name: northline-retail
  master: local[2]
  shuffle_partitions: 4
  driver_memory: 2g
  broadcast_threshold_bytes: 10485760
pipeline:
  name: northline_medallion
  amount_tolerance: "0.05"
  dq_fail_rate_alert_threshold: 0.15
  retry_attempts: 3
  retry_backoff_seconds: 0.2
  scd2_epoch: "2020-01-01T00:00:00Z"
  inventory_window_days: 3
alerts:
  webhook_url: ${NL_ALERT_WEBHOOK_URL:-}
secrets:
  mode: env
  scope: nl-kv-dev
logging:
  dir: ${NL_LOG_DIR:-data/logs}
